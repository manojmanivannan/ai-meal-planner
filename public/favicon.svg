<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="kitchentable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="48" height="48" rx="12" fill="url(#kitchentable-grad)" />
  
  <!-- Steaming pot / bowl and lid motif -->
  <g filter="url(#subtle-shadow)">
    <!-- Steam lines -->
    <path d="M18 13C17 11.5 18 10 17 8.5" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M24 12C23 10.5 24 9 23 7.5" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M30 13C29 11.5 30 10 29 8.5" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Bowl / Cookware Body -->
    <path d="M12 21C12 18.5 14 17 17 17H31C34 17 36 18.5 36 21V23C36 29 30.6 34 24 34C17.4 34 12 29 12 23V21Z" fill="#FFFFFF" />
    
    <!-- Cutout / Inner Rim Detail -->
    <ellipse cx="24" cy="21" rx="10" ry="2.5" fill="#047857" opacity="0.25" />
    
    <!-- Table base line / accent -->
    <path d="M14 38H34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <path d="M20 34V38M28 34V38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
